<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0B10">
<title>照著框拍</title>
<style>
/* Camera UI: one dark look on purpose (a viewfinder). 3:4 viewport with overlay, category tabs, template strip, shutter row */
:root{
  --bg:#0E0B10; --panel:#1B1620; --ink:#F4EEF6; --muted:#A397AC; --accent:#E9C98A; --rec:#FF6688;
  color-scheme:dark;
  --f:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));font-size:14px}
.top b{font-size:16px;letter-spacing:.06em}
.ibtn{background:var(--panel);color:var(--ink);border:0;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px}
.ibtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vf{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:3/4;max-height:calc(100dvh - 344px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:#000;overflow:hidden;touch-action:none}
@supports not (height:100dvh){.vf{max-height:calc(100vh - 344px)}}
.fbar{display:flex;gap:8px;overflow-x:auto;padding:6px max(14px,env(safe-area-inset-left,0px)) 2px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar button{flex:0 0 auto;position:relative;background:var(--panel);color:var(--ink);border:0;border-radius:99px;padding:7px 13px;font:500 13px var(--f)}
.fbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fbar button.rec::after{content:"推薦";position:absolute;top:-6px;right:-4px;font-size:9px;font-weight:700;background:var(--accent);color:#1a1408;padding:1px 5px;border-radius:99px}
.fbar .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf video.mirror{transform:scaleX(-1)}
.vf canvas{position:absolute;inset:0;width:100%;height:100%}
.banner{position:absolute;left:10px;top:10px;right:10px;display:flex;pointer-events:none}
.banner span{background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;padding:6px 12px;border-radius:99px;max-width:100%}
.lens{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(0,0,0,.35);padding:5px;border-radius:99px}
.lens button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font:600 13px var(--f)}
.lens button[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.lens button.suggest:not([aria-pressed="true"]){box-shadow:inset 0 0 0 1px rgba(233,201,138,.6)}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:800;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5);pointer-events:none}
.focus{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:1.5px solid var(--accent);border-radius:6px;pointer-events:none}
.focus.go{animation:fz .35s ease-out}
@keyframes fz{from{transform:scale(1.5);opacity:.4}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.focus.go{animation:none}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:24px;background:var(--bg);font-size:15px;line-height:1.6}
.msg button{background:var(--accent);color:#1a1408;border:0;border-radius:12px;padding:12px 20px;font:700 16px var(--f)}
.hint{text-align:center;font-size:12px;color:var(--muted);padding:6px 14px 0;min-height:24px}
.tabs{display:flex;justify-content:center;gap:6px;padding:6px 14px 0}
.tabs button{background:none;border:0;color:var(--muted);font:600 14px var(--f);padding:6px 12px;border-radius:99px;letter-spacing:.06em}
.tabs button[aria-pressed="true"]{color:var(--bg);background:var(--accent)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px max(14px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none;min-height:104px}
.strip::-webkit-scrollbar{display:none}
.tpl{flex:0 0 auto;width:66px;border:0;padding:0;background:none;color:var(--ink);font:inherit;font-size:11px;display:flex;flex-direction:column;gap:5px;align-items:center;line-height:1.25;text-align:center}
.tpl canvas{width:66px;height:88px;border-radius:10px;background:#2A2330;display:block}
.tpl[aria-pressed="true"] canvas{outline:2px solid var(--accent);outline-offset:1px}
.refbox{display:flex;flex-direction:column;gap:8px;padding:4px 14px 0;width:100%;max-width:560px;margin:0 auto;font-size:13px}
.refbox .row{display:flex;gap:10px;align-items:center}
.file{position:relative;overflow:hidden;display:inline-block}
.file input{position:absolute;inset:0;opacity:0}
.refbox input[type=range]{flex:1;accent-color:var(--accent)}
.shoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 22px 12px;margin-top:auto}
.shoot .l{justify-self:start}.shoot .r{justify-self:end}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active span{transform:scale(.9)}
.thumb{width:48px;height:48px;border-radius:10px;border:2px solid #fff;object-fit:cover;background:var(--panel)}
#review{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#review img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:12px}
#review .row{display:flex;gap:10px}
#review .row button{flex:1;padding:14px;border-radius:12px;border:0;font:700 16px var(--f);background:var(--panel);color:var(--ink)}
#review .row button.save{background:var(--accent);color:#1a1408}
#review p{margin:0;text-align:center;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;flex-direction:column;line-height:1.2"><b>照著框拍</b><span id="res" style="font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums"></span></div>
  <div style="display:flex;gap:8px">
    <button class="ibtn" id="gridBtn" aria-pressed="true">格線</button>
    <button class="ibtn" id="timerBtn" aria-pressed="false">倒數 3 秒</button>
  </div>
</div>

<div class="vf" id="vf">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="pc" hidden></canvas>
  <canvas id="ov"></canvas>
  <div class="banner"><span id="banner"></span></div>
  <div class="lens" id="lens"></div>
  <div class="focus" id="focus" hidden></div>
  <div class="count" id="count" hidden></div>
  <div class="flash" id="flash"></div>
  <div class="msg" id="msg">
    <div>點下面按鈕開啟相機。<br>請允許使用相機。</div>
    <button id="startBtn">開啟相機</button>
  </div>
</div>
<div class="hint" id="hint">拖曳虛線移位置，雙指縮放大小，點一下對焦。</div>
<div class="fbar" id="fbar"></div>
<input id="matchIn" type="file" accept="image/*" hidden>
<div class="refbox" id="matchRow" hidden>
  <div class="row"><span>追色強度</span><input id="matchK" type="range" min="20" max="100" value="80"><output id="matchOut" style="color:var(--muted);min-width:3ch;font-variant-numeric:tabular-nums">80</output></div>
</div>

<div class="tabs" id="tabs">
  <button data-c="people" aria-pressed="true">人像</button>
  <button data-c="food" aria-pressed="false">食物</button>
  <button data-c="scene" aria-pressed="false">風景建築</button>
  <button data-c="ref" aria-pressed="false">照片疊圖</button>
</div>
<div class="strip" id="strip"></div>
<div class="refbox" id="refbox" hidden>
  <div class="row">
    <label class="ibtn file">選一張想模仿的照片<input id="refIn" type="file" accept="image/*"></label>
    <span id="refName" style="color:var(--muted)">還沒選</span>
  </div>
  <div class="row"><span>透明度</span><input id="refOp" type="range" min="10" max="80" value="40"></div>
</div>

<div class="shoot">
  <img class="thumb l" id="thumb" alt="" hidden>
  <span class="l" id="thumbPh"></span>
  <button class="shutter" id="shutter" aria-label="拍照"><span></span></button>
  <div class="r" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
    <button class="ibtn" id="flipBtn">前／後鏡頭</button>
    <label class="ibtn file" id="hqWrap" hidden>內建相機<input id="hqIn" type="file" accept="image/*" capture="environment"></label>
  </div>
</div>

<div id="review" hidden>
  <img id="rImg" alt="剛拍的照片">
  <p id="rTip">按「存到相簿」後選「儲存影像」。也可以長按照片儲存。</p>
  <div class="row">
    <button id="retake">再拍一張</button>
    <button class="save" id="saveBtn">存到相簿</button>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const v=$('v'),ov=$('ov'),oc=ov.getContext('2d'),vf=$('vf');

/* ---------- templates ----------
   Coordinates: x = fraction of width, y = fraction of height. Circle r = fraction of width.
   s: shapes  rect{x1,y1,x2,y2,round}  circ{x,y,r,cross}  line{x1,y1,x2,y2,arrow}  sil{x,y1,y2,kind}  text{x,y,t} */
const TPL={
 people:[
  {n:'全身置中',lens:'1',say:'站進框裡，腳踩框底',s:[
    {k:'sil',x:.5,y1:.3,y2:.92,kind:'stand'},{k:'rect',x1:.37,y1:.3,x2:.63,y2:.92,round:1},{k:'text',x:.5,y:.955,t:'腳在這'}]},
  {n:'坐著',lens:'2',say:'坐好，整個人放進框',s:[
    {k:'sil',x:.5,y1:.27,y2:.94,kind:'sit'},{k:'rect',x1:.35,y1:.27,x2:.65,y2:.94,round:1}]},
  {n:'半身',lens:'2',say:'頭頂留一點空，胸口以上',s:[
    {k:'sil',x:.5,y1:.2,y2:1.0,kind:'half'},{k:'rect',x1:.24,y1:.18,x2:.76,y2:1.02,round:1}]},
  {n:'臉在三分點',lens:'2',say:'眼睛對準圈圈中間',s:[
    {k:'circ',x:.667,y:.333,r:.09,cross:1},{k:'rect',x1:.52,y1:.24,x2:.82,y2:1.02,round:1}]},
  {n:'看的方向留白',lens:'1',say:'她看向箭頭那邊，前面留空',s:[
    {k:'sil',x:.33,y1:.32,y2:.92,kind:'stand'},{k:'rect',x1:.22,y1:.32,x2:.44,y2:.92,round:1},{k:'line',x1:.5,y1:.5,x2:.85,y2:.5,arrow:1}]},
  {n:'小人遠景',lens:'0.5',say:'地平線放下面三分之一，人小小的',s:[
    {k:'line',x1:0,y1:.667,x2:1,y2:.667},{k:'rect',x1:.635,y1:.55,x2:.70,y2:.8,round:1},{k:'text',x:.667,y:.84,t:'人'}]},
  {n:'消失點',lens:'1',say:'站在路中間，線條往她集中',s:[
    {k:'line',x1:.5,y1:.48,x2:.04,y2:1},{k:'line',x1:.5,y1:.48,x2:.96,y2:1},{k:'rect',x1:.45,y1:.5,x2:.55,y2:.74,round:0}]},
 ],
 food:[
  {n:'兩點',lens:'1',say:'主角一個圈，配角一個圈',s:[
    {k:'circ',x:.34,y:.36,r:.17},{k:'circ',x:.64,y:.68,r:.23}]},
  {n:'三角',lens:'2',say:'三樣東西排成三角形',s:[
    {k:'circ',x:.5,y:.3,r:.15},{k:'circ',x:.3,y:.66,r:.19},{k:'circ',x:.72,y:.62,r:.16},{k:'tri',pts:[[.5,.3],[.3,.66],[.72,.62]]}]},
  {n:'俯拍三角',lens:'1',say:'手機舉高，垂直往下拍',s:[
    {k:'circ',x:.32,y:.32,r:.15},{k:'circ',x:.7,y:.4,r:.13},{k:'circ',x:.45,y:.7,r:.22},{k:'tri',pts:[[.32,.32],[.7,.4],[.45,.7]]}]},
  {n:'俯拍置中',lens:'1',say:'盤子放正中間，正上方往下拍',s:[
    {k:'circ',x:.5,y:.52,r:.34},{k:'circ',x:.5,y:.52,r:.15},{k:'circ',x:.84,y:.14,r:.08}]},
  {n:'斜角桌面',lens:'2',say:'桌緣斜斜穿過畫面',s:[
    {k:'line',x1:0,y1:.82,x2:1,y2:.42},{k:'circ',x:.42,y:.56,r:.2},{k:'circ',x:.75,y:.34,r:.1}]},
  {n:'飲料特寫',lens:'2',say:'杯子放框裡，杯口上方留一點空',s:[
    {k:'rect',x1:.3,y1:.24,x2:.7,y2:.9,round:1},{k:'line',x1:.3,y1:.34,x2:.7,y2:.34}]},
  {n:'甜點低角度',lens:'2',say:'手機貼近桌面平拍，背景會糊',s:[
    {k:'line',x1:0,y1:.72,x2:1,y2:.72},{k:'circ',x:.5,y:.6,r:.24}]},
 ],
 scene:[
  {n:'置中對稱',lens:'2',say:'建築左右對稱，屋頂對準斜線',s:[
    {k:'line',x1:.06,y1:.44,x2:.5,y2:.2},{k:'line',x1:.5,y1:.2,x2:.94,y2:.44},{k:'rect',x1:.38,y1:.3,x2:.62,y2:.56,round:0}]},
  {n:'主體左三分',lens:'1',say:'主體放左邊三分線，右邊留天空',s:[
    {k:'rect',x1:.2,y1:.24,x2:.46,y2:.86,round:0}]},
  {n:'主體右三分',lens:'1',say:'主體放右邊三分線，左邊留空間',s:[
    {k:'rect',x1:.54,y1:.24,x2:.8,y2:.86,round:0}]},
  {n:'地平線放低',lens:'0.5',say:'天空好看，地平線放下面三分之一',s:[
    {k:'line',x1:0,y1:.667,x2:1,y2:.667},{k:'text',x:.5,y:.62,t:'地平線'}]},
  {n:'地平線放高',lens:'0.5',say:'地面或水面好看，地平線放上面',s:[
    {k:'line',x1:0,y1:.333,x2:1,y2:.333},{k:'text',x:.5,y:.29,t:'地平線'}]},
  {n:'引導線',lens:'0.5',say:'道路、欄杆、走廊的線條往主體集中',s:[
    {k:'line',x1:.08,y1:1,x2:.5,y2:.44},{k:'line',x1:.92,y1:1,x2:.5,y2:.44},{k:'circ',x:.5,y:.4,r:.06}]},
  {n:'仰拍高樓',lens:'0.5',say:'手機貼近地面往上拍，線條往上收',s:[
    {k:'line',x1:.12,y1:1,x2:.4,y2:.05},{k:'line',x1:.88,y1:1,x2:.6,y2:.05},{k:'line',x1:.4,y1:.05,x2:.6,y2:.05}]},
  {n:'框中框',lens:'1',say:'用門、窗或樹枝把主體框起來',s:[
    {k:'rect',x1:.07,y1:.07,x2:.93,y2:.93,round:0},{k:'rect',x1:.36,y1:.38,x2:.64,y2:.66,round:0}]},
 ]
};
let cat='people', cur=0, showGrid=true, timer=false;
let G={dx:0,dy:0,k:1};   // group transform around center
let refImg=null, refOp=.4;

/* ---------- shape drawing (shared by overlay and thumbnails) ---------- */
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function sil(g,cx,top,h,kind){
  g.save();g.fillStyle='rgba(255,255,255,.16)';const u=h;
  if(kind==='half'){g.beginPath();g.ellipse(cx,top+u*.2,u*.11,u*.14,0,0,7);g.fill();
    g.beginPath();g.moveTo(cx-u*.36,top+u);g.quadraticCurveTo(cx-u*.34,top+u*.42,cx,top+u*.4);g.quadraticCurveTo(cx+u*.34,top+u*.42,cx+u*.36,top+u);g.fill();}
  else if(kind==='sit'){g.beginPath();g.ellipse(cx,top+u*.08,u*.055,u*.07,0,0,7);g.fill();
    rr(g,cx-u*.09,top+u*.17,u*.18,u*.36,u*.06);g.fill();rr(g,cx-u*.09,top+u*.47,u*.22,u*.1,u*.05);g.fill();
    rr(g,cx+u*.05,top+u*.5,u*.08,u*.48,u*.04);g.fill();rr(g,cx-u*.05,top+u*.52,u*.08,u*.46,u*.04);g.fill();}
  else{g.beginPath();g.ellipse(cx,top+u*.065,u*.05,u*.065,0,0,7);g.fill();
    rr(g,cx-u*.085,top+u*.15,u*.17,u*.38,u*.06);g.fill();rr(g,cx-u*.075,top+u*.5,u*.065,u*.5,u*.03);g.fill();rr(g,cx+u*.01,top+u*.5,u*.065,u*.5,u*.03);g.fill();}
  g.restore();
}
function drawShapes(g,W,H,shapes,T,lw){
  const X=x=>((x-.5)*T.k+.5+T.dx)*W, Y=y=>((y-.5)*T.k+.5+T.dy)*H, R=r=>r*T.k*W;
  g.save();g.lineCap='round';g.lineJoin='round';
  // pass 1: silhouettes
  shapes.filter(s=>s.k==='sil').forEach(s=>sil(g,X(s.x),Y(s.y1),Y(s.y2)-Y(s.y1),s.kind));
  // pass 2: lines with a soft dark halo then white dashes
  for(const pass of [0,1]){
    g.strokeStyle=pass?'#fff':'rgba(0,0,0,.35)';g.fillStyle=g.strokeStyle;
    g.lineWidth=pass?lw:lw+2.5;g.setLineDash(pass?[lw*3.2,lw*2.4]:[]);
    shapes.forEach(s=>{
      if(s.k==='rect'){rr(g,X(s.x1),Y(s.y1),X(s.x2)-X(s.x1),Y(s.y2)-Y(s.y1),s.round?Math.min(lw*9,(X(s.x2)-X(s.x1))/4):0);g.stroke();}
      else if(s.k==='circ'){g.beginPath();g.arc(X(s.x),Y(s.y),R(s.r),0,7);g.stroke();
        if(s.cross){const c=R(s.r)*.45;g.beginPath();g.moveTo(X(s.x)-c,Y(s.y));g.lineTo(X(s.x)+c,Y(s.y));g.moveTo(X(s.x),Y(s.y)-c);g.lineTo(X(s.x),Y(s.y)+c);g.stroke();}}
      else if(s.k==='line'){g.beginPath();g.moveTo(X(s.x1),Y(s.y1));g.lineTo(X(s.x2),Y(s.y2));g.stroke();
        if(s.arrow){g.setLineDash([]);const a=Math.atan2(Y(s.y2)-Y(s.y1),X(s.x2)-X(s.x1)),L=lw*6;
          g.beginPath();g.moveTo(X(s.x2)-L*Math.cos(a-.5),Y(s.y2)-L*Math.sin(a-.5));g.lineTo(X(s.x2),Y(s.y2));g.lineTo(X(s.x2)-L*Math.cos(a+.5),Y(s.y2)-L*Math.sin(a+.5));g.stroke();
          g.setLineDash(pass?[lw*3.2,lw*2.4]:[]);}}
      else if(s.k==='tri'){g.save();g.globalAlpha=.5;g.lineWidth=g.lineWidth*.7;g.beginPath();s.pts.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.closePath();g.stroke();g.restore();}
      else if(s.k==='text'&&pass){g.setLineDash([]);g.font=`600 ${lw*6}px ${getComputedStyle(document.body).fontFamily}`;g.textAlign='center';g.textBaseline='middle';
        g.lineWidth=3;g.strokeStyle='rgba(0,0,0,.45)';g.strokeText(s.t,X(s.x),Math.min(Y(s.y),H-lw*5));g.fillText(s.t,X(s.x),Math.min(Y(s.y),H-lw*5));g.strokeStyle='#fff';}
    });
  }
  g.restore();
}
function gridLines(g,W,H,lw){
  g.save();g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=lw;

/* ---------- drag + pinch (moves the whole guide, or the reference photo) ---------- */

let tap=null;
vf.addEventListener('pointerdown',e=>{if(e.target.closest('.lens,.msg'))return;vf.setPointerCapture(e.pointerId);pts.set(e.pointerId,rel(e));snap();
  tap=pts.size===1?{p:rel(e),t:Date.now()}:null;});
vf.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,rel(e));
  const c=center();let k=start.G.k;if(pts.size>1&&start.d>0)k=Math.max(.3,Math.min(3,start.G.k*spread()/start.d));

  if(tap&&pts.size===1&&e.type==='pointerup'){const p=rel(e);
    if(Math.hypot(p.x-tap.p.x,p.y-tap.p.y)<.015&&Date.now()-tap.t<350){G={...start.G};draw();focusAt(p);}}

  clearTimeout(focusAt.t);focusAt.t=setTimeout(()=>ring.hidden=true,1200);
  if(!stream||!trCap)return;
  const tr=stream.getVideoTracks()[0],adv={};
  const px=facing==='user'?1-p.x:p.x;
  if(trCap.pointsOfInterest!==undefined||'pointsOfInterest' in (tr.getSettings?tr.getSettings():{}))adv.pointsOfInterest=[{x:px,y:p.y}];
  if(trCap.focusMode&&trCap.focusMode.includes('single-shot'))adv.focusMode='single-shot';
  if(trCap.exposureMode&&trCap.exposureMode.includes('single-shot'))adv.exposureMode='single-shot';
  if(!Object.keys(adv).length){adv.pointsOfInterest=[{x:px,y:p.y}];}
  try{await tr.applyConstraints({advanced:[adv]});}catch(e){}

  clearTimeout(focusAt.c);focusAt.c=setTimeout(()=>{if(stream&&trCap.focusMode&&trCap.focusMode.includes('continuous'))

async function open(deviceId){

    try{await tr.applyConstraints({width:{ideal:cap.width.max},height:{ideal:cap.height.max}});}catch(e){}
  }
  trCap=cap;curZoom=null;
  if(cap.focusMode&&cap.focusMode.includes('continuous')){try{await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}}

  lensMap={};
  const back=cams.filter(c=>!/front|前|user|facetime/i.test(c.label));
  const find=re=>back.find(c=>re.test(c.label));
  const uw=find(/ultra ?wide|超廣角/i),tele=find(/tele|長焦|望遠/i);
  const wide=find(/^back camera$|^後置相機$|^後鏡頭$|wide angle|廣角相機/i)||back.find(c=>c!==uw&&c!==tele&&!/dual|triple|雙|三/i.test(c.label));

    const b=document.createElement('button');b.textContent=k==='0.5'?'.5':k+'x';b.setAttribute('aria-pressed',curLens===k);

  const prev=curLens;curLens=k;
  try{
    if(lensMap[k]){await open(lensMap[k].id);}
    else if(zoomCap){if(prev!=='1'&&lensMap[prev]&&lensMap['1'])await open(lensMap['1'].id);
      curZoom=Math.max(zoomCap.min,Math.min(zoomCap.max,parseFloat(k)));
      await stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:curZoom}]});}
    else if(k!=='1'){curLens=prev;if(fromTpl)hint(`這支手機的瀏覽器不能切 ${k==='0.5'?'.5':k}x，用前後走動調整大小。`);}

/* monotone cubic curve through the points → 256-entry table */

      let r=L.R[d[i]],gg=L.G[d[i+1]],b=L.B[d[i+2]];
      let l=.299*r+.587*gg+.114*b;
      if(bw){r=gg=b=l;}
      else{
        const t=l/255,ws=(1-t)*(1-t),wh=t*t;
        r+=sh[0]*ws+hi[0]*wh;gg+=sh[1]*ws+hi[1]*wh;b+=sh[2]*ws+hi[2]*wh;
        if(sat!==1){l=.299*r+.587*gg+.114*b;r=l+(r-l)*sat;gg=l+(gg-l)*sat;b=l+(b-l)*sat;}
        if(hueOps){
          const er=r-(gg>b?gg:b);if(er>0&&rk!==1)r=r-er+er*rk;          // reds: mute (<1) or deepen (>1)
          const eg=gg-(r>b?r:b);if(eg>0&&gk!==1)gg=gg-eg+eg*gk;        // greens
          const eb=b-(r>gg?r:gg);if(eb>0&&bc)gg+=eb*bc;                // blues lean cyan
        }
      }
      if(vig){const k=1-vig*((x-cx)*(x-cx)+dy2)*rr;r*=k;gg*=k;b*=k;}
      if(gr){let hsh=(((x/blk)|0)*73856093)^(by*19349663)^seed;hsh=Math.imul(hsh^(hsh>>>15),2246822519);hsh^=hsh>>>13;
        const nz=((hsh&1023)/1023-.5)*gr*2*(1-Math.abs(l/255-.5));r+=nz;gg+=nz;b+=nz;}
      d[i]=r;d[i+1]=gg;d[i+2]=b;
    }
  }
  g.putImageData(img,0,0);
}
function crop(vw,vh){const want=3/4;let sw=vw,sh=vh;if(vw/vh>want)sw=vh*want;else sh=vw/want;return[(vw-sw)/2,(vh-sh)/2,sw,sh];}

/* filter chips */
function buildFbar(){
  const box=$('fbar');box.innerHTML='';
  const a=document.createElement('button');a.textContent='自動';a.setAttribute('aria-pressed',autoFil);
  a.onclick=()=>{autoFil=!autoFil;if(autoFil&&recFil)fil=recFil;buildFbar();};box.appendChild(a);
  // 追色 chip: first tap picks a reference photo, later taps select it; tap again while selected to change photo
  const m=document.createElement('button');m.setAttribute('aria-pressed',fil==='match');
  m.innerHTML=refThumb?`<img src="${refThumb}" alt="" style="width:16px;height:16px;border-radius:4px;object-fit:cover;vertical-align:-3px;margin-right:6px">追色`:'＋ 追色';
  m.onclick=()=>{if(!refStats||fil==='match'){$('matchIn').click();return;}fil='match';autoFil=false;buildFbar();};
  box.appendChild(m);
  $('matchRow').hidden=fil!=='match';
  Object.entries(FIL).forEach(([k,p])=>{
    const b=document.createElement('button');b.innerHTML=`<span class="sw" style="background:${p.sw}"></span>${p.n}`;
    b.setAttribute('aria-pressed',fil===k&&!(autoFil&&k!==fil));if(k===recFil)b.classList.add('rec');
    b.onclick=()=>{fil=k;autoFil=false;buildFbar();};box.appendChild(b);
  });
  $('pc').hidden=fil==='none';
}

/* analyse the scene about once a second: average brightness, warmth, saturation, greenness */
const an=document.createElement('canvas');an.width=48;an.height=64;const ag=an.getContext('2d',{willReadFrequently:true});
function analyse(){
  if(!stream||!v.videoWidth)return;
  const [sx,sy,sw,sh]=crop(v.videoWidth,v.videoHeight);ag.drawImage(v,sx,sy,sw,sh,0,0,48,64);
  const d=ag.getImageData(0,0,48,64).data;let L=0,warm=0,S=0,green=0,n=d.length/4;
  for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);L+=.299*r+.587*g+.114*b;S+=mx?(mx-mn)/mx:0;warm+=r-b;if(g>r*1.08&&g>b*1.08)green++;}
  L/=n;S/=n;warm/=n;green/=n;
  let k,why;
  if(L<.28){k='night';why='畫面偏暗';}
  else if(green>.35){k='forest';why='綠色很多';}
  else if(warm<-.04){k='clear';why='畫面偏藍';}
  else if(cat==='food'&&warm>.04){k='tasty';why='食物偏暖色';}
  else if(L>.66&&S<.3){k='milk';why='畫面很亮、顏色淡';}
  else if(warm>.14&&L>.4){k='golden';why='暖色光線，像夕陽';}
  else if(warm>.08){k=cat==='people'?'portra':'latte';why='畫面偏暖';}
  else if(S<.14){k='film';why='顏色偏灰';}
  else if(cat==='scene'&&S>.3){k='slide';why='顏色飽和、光線好';}
  else{k='vivid';why='光線正常';}
  if(k!==recFil){recFil=k;if(autoFil)fil=k;buildFbar();}
  $('hint').dataset.rec=`${why}，推薦「${FIL[k].n}」`;
  if(!hintT)$('hint').textContent=$('hint').dataset.rec;
}
setInterval(analyse,1000);

$('matchIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const bmp=await createImageBitmap(f);
    refStats=statsOf(bmp,bmp.width,bmp.height);
    const t=document.createElement('canvas');t.width=t.height=48;
    const s=Math.min(bmp.width,bmp.height);t.getContext('2d').drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,48,48);
    refThumb=t.toDataURL('image/jpeg',.7);
    fil='match';autoFil=false;buildFbar();hint('已套用參考照片的色調，再點一次「追色」可以換照片。');
  }catch(err){hint('這張照片打不開，換一張試試。');}
};
$('matchK').oninput=e=>{matchK=e.target.value/100;$('matchOut').textContent=e.target.value;};

/* live preview with the filter, drawn small for speed */
const pc=$('pc'),pg=pc.getContext('2d',{willReadFrequently:true});
function loop(){
  if(stream&&v.videoWidth&&fil!=='none'){
    const [sx,sy,sw,sh]=crop(v.videoWidth,v.videoHeight);const W=360,H=480;
    if(pc.width!==W){pc.width=W;pc.height=H;}
    pg.save();if(facing==='user'){pg.translate(W,0);pg.scale(-1,1);}
    pg.drawImage(v,sx,sy,sw,sh,0,0,W,H);pg.restore();applyFilter(pg,W,H,fil);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
buildFbar();

/* ---------- capture: crops to exactly what the viewfinder shows, guides not included, filter applied ---------- */
let lastBlob=null,lastURL=null;
function grab(){
  const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
  const [sx,sy,sw,sh]=crop(vw,vh);
  const c=document.createElement('canvas');c.width=Math.round(sw);c.height=Math.round(sh);const g=c.getContext('2d',{willReadFrequently:true});
  if(facing==='user'){g.translate(c.width,0);g.scale(-1,1);}
  g.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  g.setTransform(1,0,0,1,0,0);applyFilter(g,c.width,c.height,fil);return c;
}
/* Native still photo (Android Chrome etc.): full sensor resolution, cropped to 3:4 */
async function grabPhoto(){
  if(!imgCap)return null;
  try{
    const blob=await imgCap.takePhoto(photoSet||undefined);const bmp=await createImageBitmap(blob);
    if(curZoom&&stream){stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:curZoom}]}).catch(()=>{});}
    const [sx,sy,sw,sh]=crop(bmp.width,bmp.height);
    const c=document.createElement('canvas');c.width=Math.round(sw);c.height=Math.round(sh);const g=c.getContext('2d',{willReadFrequently:true});
    if(facing==='user'){g.translate(c.width,0);g.scale(-1,1);}
    g.drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);g.setTransform(1,0,0,1,0,0);
    applyFilter(g,c.width,c.height,fil);return c;
  }catch(e){imgCap=null;showRes();return null;}
}
function finish(c){
  c.toBlob(b=>{lastBlob=b;if(lastURL)URL.revokeObjectURL(lastURL);lastURL=URL.createObjectURL(b);
    $('thumb').src=lastURL;$('thumb').hidden=false;$('thumbPh').hidden=true;openReview();},'image/jpeg',.97);
}
async function shoot(){
  if(!stream)return;
  if(timer){const el=$('count');el.hidden=false;for(let i=3;i>0;i--){el.textContent=i;await new Promise(r=>setTimeout(r,1000));}el.hidden=true;}
  $('flash').style.opacity=.8;setTimeout(()=>$('flash').style.opacity=0,80);
  const c=(await grabPhoto())||grab();if(!c)return;finish(c);
}
/* 高畫質: hand off to the phone's own camera app (full HDR/night processing), then apply the chosen filter */
$('hqIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const bmp=await createImageBitmap(f);
    const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;const g=c.getContext('2d',{willReadFrequently:true});
    g.drawImage(bmp,0,0);applyFilter(g,c.width,c.height,fil);finish(c);
  }catch(err){hint('這張照片打不開，請再拍一次。');}
};
function openReview(){$('rImg').src=lastURL;$('review').hidden=false;}
$('shutter').onclick=shoot;$('thumb').onclick=openReview;$('retake').onclick=()=>{$('review').hidden=true;};
$('saveBtn').onclick=async()=>{
  if(!lastBlob)return;
  const name='frame-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.jpg';
  const file=new File([lastBlob],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=lastURL;a.download=name;document.body.appendChild(a);a.click();a.remove();
  $('rTip').textContent='已下載。iPhone 在「檔案」App 的下載項目裡，也可以長按照片儲存。';
};

new ResizeObserver(()=>{sizeCanvas();draw();}).observe(vf);
sizeCanvas();buildStrip();pick(0);
})();
</script>
