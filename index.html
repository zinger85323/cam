<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0B10">
<title>照著框拍</title>
<style>
/* Camera UI: one dark look on purpose (a viewfinder). 3:4 viewport with overlay, category tabs, template strip, shutter row */
:root{
  --bg:#0E0B10; --panel:#1B1620; --ink:#F4EEF6; --muted:#A397AC; --accent:#E9C98A; --rec:#FF6688;
  color-scheme:dark;
  --f:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f);overscroll-behavior:none}
/* the page is pinned to the visible screen so the shutter always sits at the very bottom (no blank strip under it) */
body{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
/* toolbar only: the app name and version line are hidden; the buttons stay on one row */
.top{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));font-size:13px}
.top>div:first-child{display:none!important}
.top>div:last-child{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.top .ibtn{white-space:nowrap;border-radius:8px;padding:6px 10px;font-size:13px}
.top b{font-size:16px;letter-spacing:.06em}
.ibtn{background:var(--panel);color:var(--ink);border:0;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px}
.ibtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vf{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:3/4;max-height:calc(100dvh - 290px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:#000;overflow:hidden;touch-action:none}
@supports not (height:100dvh){.vf{max-height:calc(100vh - 290px)}}
body.cp .vf{max-height:calc(100dvh - 408px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
@supports not (height:100dvh){body.cp .vf{max-height:calc(100vh - 408px)}}
/* landscape (turning the phone sideways): the viewfinder fills the screen like the native camera;
   the shutter column sits at the right edge and the template picker folds into a small button */
body.lscape{overflow:hidden}
/* 設定 panel: shown over the bottom of the viewfinder; each row appears only if this phone's camera offers it */
.camset{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:10px 14px;background:rgba(0,0,0,.72);color:#fff;display:grid;gap:8px;font-size:13px}
.camset .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.camset .row[hidden]{display:none!important}
.camset input[type=range]{flex:1;min-width:0}
.camset output{min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}
body.lscape .camset{right:112px}
body.lscape .hint,body.lscape .banner,body.lscape #refbox{display:none!important}
body.lscape .vf{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;margin:0;z-index:1}
body.lscape .shoot{position:fixed;top:0;right:0;bottom:0;width:112px;margin:0;padding:12px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:4}
body.lscape .shoot .l,body.lscape .shoot .r{justify-self:auto}
/* controls kept on the left, clear of the phone's side safe area: 分頁 at the top, 調色/格線/倒數 and 動作 at the bottom */
/* 選項 folds the whole left column (分頁, 調色, 格線, 倒數, 動作) into one small button at the top left */
body.lscape #lcBtn{display:block;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:6;margin:0}
body:not(.lscape) #lcBtn{display:none!important}
body.lscape:not(.lcol) #tabs,body.lscape:not(.lcol) .top,body.lscape:not(.lcol) #stripBtn,body.lscape:not(.lcol) #strip,body.lscape:not(.lcol) #fbar,body.lscape:not(.lcol) #tbar,body.lscape:not(.lcol) #palRow,body.lscape:not(.lcol) #fixRow,body.lscape:not(.lcol) #matchRow{display:none!important}
body.lscape #tabs{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(108px + env(safe-area-inset-left,0px));z-index:5;margin:0;display:flex!important;gap:6px}
body.lscape #tabs button{padding:6px 10px;font-size:13px}
body.lscape .top{display:flex;position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px;z-index:5;margin:0;padding:0;background:none;border:0}
body.lscape #stripBtn{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:58px;z-index:5;margin:0}
body.lscape #strip{position:fixed;left:0;right:112px;bottom:0;z-index:3;margin:0;padding:10px calc(10px + env(safe-area-inset-left,0px)) 56px;max-height:55%;overflow-y:auto;background:rgba(0,0,0,.72)}
body.lscape.cp #fbar,body.lscape.cp #tbar,body.lscape.cp #fixRow,body.lscape.cp #matchRow,body.lscape.cp #palRow{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));right:112px;z-index:3;max-height:40%;overflow-y:auto;background:rgba(0,0,0,.72);border-radius:12px;padding:8px}
body.lscape.cp #tbar{top:calc(56px + env(safe-area-inset-top,0px))}
body.lscape.cp #fbar{top:calc(106px + env(safe-area-inset-top,0px));max-height:34%}
body.lscape.cp #fixRow,body.lscape.cp #matchRow{bottom:104px}
body.lscape.cp #palRow{bottom:136px}
body.lscape.palon #fixRow{display:none!important}   /* landscape is tight: the palette row takes the white-balance row's place */
/* 填滿: the viewfinder takes the space the phone leaves; the photo is cropped to that same shape */
body.fill:not(.lscape) .vf{aspect-ratio:auto;flex:1 1 auto;min-height:0;max-height:none}
/* color panel: hidden until 調色 is tapped */
/* 調色 and 構圖 are two separate panels: only one is on screen at a time */
body.cp:not(.lscape) #tabs,body.cp:not(.lscape) #stripBtn,body.cp:not(.lscape) #strip,body.cp:not(.lscape) #refbox{display:none!important}
body:not(.cp) #fbar,body:not(.cp) #tbar,body:not(.cp) #fixRow,body:not(.cp) #matchRow,body:not(.cp) #palRow{display:none!important}
.fbar,.refbox{flex-shrink:0}
.pal{display:flex;width:100%;height:38px;border-radius:10px;overflow:hidden}
.pal label{flex:1;position:relative}
.pal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0}
.fbar{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:6px max(14px,env(safe-area-inset-left,0px)) 2px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar button{flex:0 0 auto;position:relative;background:var(--panel);color:var(--ink);border:0;border-radius:99px;padding:7px 13px;font:500 13px var(--f)}
.fbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fbar button.rec::after{content:"推薦";position:absolute;top:-6px;right:-4px;font-size:9px;font-weight:700;background:var(--accent);color:#1a1408;padding:1px 5px;border-radius:99px}
.fbar .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
/* look cards: each look shown on the live frame, name underneath; the chosen one gets an outline */
.fbar button.th{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;color:var(--muted);padding:3px;border-radius:12px;font:500 11px var(--f)}
.fbar button.th[aria-pressed="true"]{background:none;color:var(--ink)}
.fbar .tw{display:block;width:64px;height:80px;border-radius:9px;overflow:hidden;outline:2px solid transparent;outline-offset:2px}
.fbar .tw img{display:block;width:100%;height:100%;object-fit:cover}
.fbar button.th[aria-pressed="true"] .tw{outline-color:var(--ink)}
.fbar button.th.rec::after{top:-2px;right:0}
.fbar .cbadge{position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.fbar .cbadge svg{width:14px;height:14px}
.fbar .cdiv{flex:0 0 2px;align-self:stretch;margin:10px 2px;border-radius:2px;background:var(--panel)}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf video.mirror{transform:scaleX(-1)}
.vf canvas{position:absolute;inset:0;width:100%;height:100%}
.banner{position:absolute;left:10px;top:10px;right:10px;display:flex;pointer-events:none}
.banner span{background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;padding:6px 12px;border-radius:99px;max-width:100%}
.lens{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(0,0,0,.35);padding:5px;border-radius:99px}
.lens button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font:600 13px var(--f)}
.lens button[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.lens button.suggest:not([aria-pressed="true"]){box-shadow:inset 0 0 0 1px rgba(233,201,138,.6)}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:800;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5);pointer-events:none}
.focus{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:1.5px solid var(--accent);border-radius:6px;pointer-events:none}
.focus.go{animation:fz .35s ease-out}
@keyframes fz{from{transform:scale(1.5);opacity:.4}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.focus.go{animation:none}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:24px;background:var(--bg);font-size:15px;line-height:1.6}
.msg button{background:var(--accent);color:#1a1408;border:0;border-radius:12px;padding:12px 20px;font:700 16px var(--f)}
.hint{text-align:center;font-size:12px;color:var(--muted);padding:6px 14px 0;min-height:24px}
.tabs{display:flex;justify-content:center;gap:6px;padding:6px 14px 0}
.tabs button{background:none;border:0;color:var(--muted);font:600 14px var(--f);padding:6px 12px;border-radius:99px;letter-spacing:.06em}
.tabs button[aria-pressed="true"]{color:var(--bg);background:var(--accent)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px max(14px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none;min-height:122px}
.strip::-webkit-scrollbar{display:none}
.tpl{flex:0 0 auto;width:66px;border:0;padding:0;background:none;color:var(--ink);font:inherit;font-size:11px;display:flex;flex-direction:column;gap:5px;align-items:center;line-height:1.25;text-align:center}
.tpl canvas{width:66px;height:88px;border-radius:10px;background:#2A2330;display:block}
.tpl[aria-pressed="true"] canvas{outline:2px solid var(--accent);outline-offset:1px}
.refbox{display:flex;flex-direction:column;gap:8px;padding:4px 14px 0;width:100%;max-width:560px;margin:0 auto;font-size:13px}
.refbox .row{display:flex;gap:10px;align-items:center}
.file{position:relative;overflow:hidden;display:inline-block}
.file input{position:absolute;inset:0;opacity:0}
.refbox input[type=range]{flex:1;accent-color:var(--accent)}
.shoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 22px 12px;margin-top:auto}
.shoot .l{justify-self:start}.shoot .r{justify-self:end}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active span{transform:scale(.9)}
.thumb{width:48px;height:48px;border-radius:10px;border:2px solid #fff;object-fit:cover;background:var(--panel)}
/* top-right pill (定時, 選單), the round buttons above the shutter, and the 選單 sheet */
.pill{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));z-index:5;display:flex;gap:2px;padding:4px;border-radius:99px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pb{position:relative;width:44px;height:36px;border:0;border-radius:99px;background:none;color:#fff;display:grid;place-items:center;padding:0}
.pb svg{width:22px;height:22px}
.pb[aria-pressed="true"]{color:var(--accent)}
.pb b{position:absolute;right:2px;bottom:0;font:700 10px var(--f);color:var(--accent)}
.ctl{display:flex;justify-content:center;gap:34px;padding:8px 22px 0}
.rb{width:48px;height:48px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);display:grid;place-items:center;padding:0}
.rb.sq{border-radius:14px}
.rb svg{width:24px;height:24px}
.rb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.35)}
.menu{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9;max-width:560px;margin:0 auto;background:#1a171d;border-radius:28px;padding:22px 14px 18px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px}
.mi{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font:600 13px var(--f);padding:0}
.mi i{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:#0f0d11}
.mi i svg{width:30px;height:30px}
.mi[aria-pressed="true"] i{background:var(--ink);color:var(--bg)}
body.lscape .menu{right:calc(120px + env(safe-area-inset-right,0px))}
body.lscape .mi i{width:56px;height:56px}
body.lscape .mgrid{gap:14px 8px}
body.lscape .pill{right:calc(122px + env(safe-area-inset-right,0px))}
body.lscape .ctl{position:fixed;right:0;top:calc(10px + env(safe-area-inset-top,0px));width:112px;padding:0 8px;gap:8px;z-index:4}
body.lscape .rb{width:44px;height:44px}
/* 水平儀: a line that stays level with the world, between two fixed marks; it turns yellow within 1° */
.level{position:absolute;inset:0;pointer-events:none;z-index:2}
.level .lv{position:absolute;left:27%;top:50%;width:46%;height:2px;border-radius:2px;background:rgba(255,255,255,.88);box-shadow:0 0 3px rgba(0,0,0,.6);transform:translateY(-50%)}
.level .lr{position:absolute;top:50%;width:12%;height:2px;margin-top:-1px;background:rgba(255,255,255,.4)}
.level .lr.a{left:8%}.level .lr.b{right:8%}
.level.ok .lv,.level.ok .lr{background:var(--accent)}
.level.flat{opacity:.25}
#flashRow{display:none!important}   /* flash now lives only in the round button above the shutter */
#review{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#review img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:12px}
#review .row{display:flex;gap:10px}
#review .row button{flex:1;padding:14px;border-radius:12px;border:0;font:700 16px var(--f);background:var(--panel);color:var(--ink)}
#review .row button.save{background:var(--accent);color:#1a1408}
#review p{margin:0;text-align:center;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<span id="res" hidden></span>

<div class="vf" id="vf">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="pc" hidden></canvas>
  <canvas id="ov"></canvas>
  <div class="banner"><span id="banner"></span></div>
  <div class="level" id="level" hidden><i class="lr a"></i><i class="lr b"></i><i class="lv" id="lvLine"></i></div>
  <div class="pill" id="pill">
    <button class="pb" id="pTimer" aria-label="定時" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg><b id="pTimerN"></b></button>
    <button class="pb" id="menuBtn" aria-label="選單" aria-expanded="false" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="9" r="1.9"/><circle cx="12" cy="9" r="1.9"/><circle cx="18" cy="9" r="1.9"/><circle cx="6" cy="15" r="1.9"/><circle cx="12" cy="15" r="1.9"/><circle cx="18" cy="15" r="1.9"/></svg></button>
  </div>
  <div class="lens" id="lens"></div>
  <div class="focus" id="focus" hidden></div>
  <div class="count" id="count" hidden></div>
  <div class="count" id="busy" hidden style="font-size:18px;font-weight:600;background:rgba(0,0,0,.35)">處理中…</div>
  <div class="flash" id="flash"></div>
  <div class="msg" id="msg">
    <div>點下面按鈕開啟相機。<br>請允許使用相機。</div>
    <button id="startBtn">開啟相機</button>
  </div>
  <div class="camset" id="camSet" hidden>
    <div class="row" id="expoRow" hidden><span style="min-width:3em">曝光</span><input id="expoIn" type="range"><output id="expoOut">0.0</output></div>
    <div class="row" id="wbRow" hidden><span style="min-width:3em">白平衡</span><button class="ibtn" id="wbAuto" aria-pressed="true">自動</button><input id="wbIn" type="range"><output id="wbOut">5000</output></div>
    <div class="row" id="flashRow" hidden><button class="ibtn" id="flashBtn" aria-pressed="false">閃光燈 關</button></div>
    <div class="row" id="isoRow" hidden><span style="min-width:3em">ISO</span><button class="ibtn" id="isoAuto" aria-pressed="true">自動</button><input id="isoIn" type="range"><output id="isoOut">100</output></div>
    <div class="row" id="dbgRow"><span style="min-width:3em">畫面</span><output id="dbgOut">–</output></div>
    <div class="row" id="verRow"><span style="min-width:3em">版本</span><output style="font-variant-numeric:tabular-nums">v2026.11.28-38</output></div>
  </div>
</div>
<div class="hint" id="hint">拖曳虛線移位置，雙指縮放大小，點一下對焦。</div>
<div class="fbar" id="tbar"></div>
<div class="fbar" id="fbar"></div>
<input id="matchIn" type="file" accept="image/*" hidden>
<input id="palIn" type="file" accept="image/*" hidden>
<div class="refbox" id="matchRow" hidden>
  <div class="row"><span>強度</span><input id="matchK" type="range" min="10" max="100" step="5" value="100"><output id="matchOut" style="color:var(--muted);min-width:3ch;font-variant-numeric:tabular-nums">100</output></div>
</div>

<div class="refbox" id="palRow" hidden>
  <div class="pal" id="palSw"></div>
  <div class="row"><button class="ibtn" id="palPhoto">換照片</button><button class="ibtn" id="palLive">取自畫面</button><span style="color:var(--muted)">點色塊可以改顏色</span></div>
</div>

<button class="ibtn" id="lcBtn" aria-expanded="false">選項 ▸</button>
<div class="tabs" id="tabs">
  <button data-c="people" aria-pressed="true">人像</button>
  <button data-c="food" aria-pressed="false">食物</button>
  <button data-c="scene" aria-pressed="false">風景建築</button>
  <button data-c="ref" aria-pressed="false">照片疊圖</button>
</div>
<button class="ibtn" id="stripBtn" aria-expanded="false" hidden></button>
<div class="strip" id="strip" hidden></div>
<div class="refbox" id="refbox" hidden>
  <div class="row">
    <label class="ibtn file">選一張想模仿的照片<input id="refIn" type="file" accept="image/*"></label>
    <span id="refName" style="color:var(--muted)">還沒選</span>
  </div>
  <div class="row"><span>透明度</span><input id="refOp" type="range" min="10" max="80" value="40"></div>
</div>

<div class="refbox" id="fixRow">
  <div class="row"><span style="min-width:4.2em">白平衡</span><input id="awbK" type="range" min="0" max="100" step="5" value="0"><output id="awbOut" style="color:var(--muted);min-width:3ch;font-variant-numeric:tabular-nums">0</output></div>
  <div class="row"><span style="min-width:4.2em">亮暗修復</span><input id="sdK" type="range" min="0" max="100" step="5" value="0"><output id="sdOut" style="color:var(--muted);min-width:3ch;font-variant-numeric:tabular-nums">0</output></div>
</div>
<div class="ctl" id="ctl">
  <button class="rb" id="flashQ" aria-label="閃光燈" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg></button>

/* ---------- shape drawing (shared by overlay and thumbnails) ---------- */
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function sil(g,cx,top,h,kind){
  g.save();g.fillStyle='rgba(255,255,255,.16)';const u=h;
  if(kind==='half'){g.beginPath();g.ellipse(cx,top+u*.2,u*.11,u*.14,0,0,7);g.fill();
    g.beginPath();g.moveTo(cx-u*.36,top+u);g.quadraticCurveTo(cx-u*.34,top+u*.42,cx,top+u*.4);g.quadraticCurveTo(cx+u*.34,top+u*.42,cx+u*.36,top+u);g.fill();}
  else if(kind==='sit'){g.beginPath();g.ellipse(cx,top+u*.08,u*.055,u*.07,0,0,7);g.fill();
    rr(g,cx-u*.09,top+u*.17,u*.18,u*.36,u*.06);g.fill();rr(g,cx-u*.09,top+u*.47,u*.22,u*.1,u*.05);g.fill();
    rr(g,cx+u*.05,top+u*.5,u*.08,u*.48,u*.04);g.fill();rr(g,cx-u*.05,top+u*.52,u*.08,u*.46,u*.04);g.fill();}
  else{g.beginPath();g.ellipse(cx,top+u*.065,u*.05,u*.065,0,0,7);g.fill();
    rr(g,cx-u*.085,top+u*.15,u*.17,u*.38,u*.06);g.fill();rr(g,cx-u*.075,top+u*.5,u*.065,u*.5,u*.03);g.fill();rr(g,cx+u*.01,top+u*.5,u*.065,u*.5,u*.03);g.fill();}
  g.restore();
}
/* ---------- pose figures (joint positions in units of body height; x from centre, y from top) ---------- */
const STAND={hd:[0,.065],nk:[0,.15],sl:[-.11,.19],sr:[.11,.19],el:[-.15,.35],er:[.15,.35],ha:[-.15,.5],hb:[.15,.5],

    hl:[-.07,.7],hr:[.07,.7],kl:[-.13,.8],kr:[.13,.8],fl:[-.14,.93],fr:[.14,.93]},   // sitting on steps, hands on knees

  lying:{hd:[-.95,.8],nk:[-.8,.84],sl:[-.65,.76],sr:[-.65,.9],el:[-.45,.98],er:[-.4,.96],ha:[-.25,.98],hb:[-.2,.95],

};
function poseFig(g,cx,top,h,name){
  const P=Object.assign({},STAND,POSES[name]||{}),X=p=>cx+p[0]*h,Y=p=>top+p[1]*h,lw=h*.075;
  g.save();g.fillStyle=g.strokeStyle='rgba(255,255,255,.16)';g.lineCap='round';g.lineJoin='round';
  const limb=(a,b,w)=>{g.lineWidth=w;g.beginPath();g.moveTo(X(P[a]),Y(P[a]));g.lineTo(X(P[b]),Y(P[b]));g.stroke();};
  [['sl','el'],['el','ha'],['sr','er'],['er','hb'],['hl','kl'],['kl','fl'],['hr','kr'],['kr','fr']].forEach(([a,b])=>limb(a,b,lw));
  g.beginPath();g.moveTo(X(P.sl),Y(P.sl));g.lineTo(X(P.sr),Y(P.sr));g.lineTo(X(P.hr),Y(P.hr));g.lineTo(X(P.hl),Y(P.hl));g.closePath();g.fill();
  limb('nk','hd',lw*.9);
  g.beginPath();g.ellipse(X(P.hd),Y(P.hd),h*.055,h*.065,0,0,7);g.fill();
  g.restore();
}
function drawShapes(g,W,H,shapes,T,lw){
  // guides are designed on a 3:4 frame: keep that shape (centred) so circles stay round and people stay upright
  // when the viewfinder is wider (sideways) or taller than 3:4
  const RW=Math.min(W,H*3/4), X=x=>W/2+((x-.5)*T.k+T.dx)*RW, Y=y=>((y-.5)*T.k+.5+T.dy)*H, R=r=>r*T.k*RW;
  g.save();g.lineCap='round';g.lineJoin='round';
  // pass 1: silhouettes
  shapes.filter(s=>s.k==='sil'||s.k==='pose').forEach(s=>s.k==='pose'?poseFig(g,X(s.x),Y(s.y1),Y(s.y2)-Y(s.y1),s.name):sil(g,X(s.x),Y(s.y1),Y(s.y2)-Y(s.y1),s.kind));
  // pass 2: lines with a soft dark halo then white dashes
  for(const pass of [0,1]){
    g.strokeStyle=pass?'#fff':'rgba(0,0,0,.35)';g.fillStyle=g.strokeStyle;
    g.lineWidth=pass?lw:lw+2.5;g.setLineDash(pass?[lw*3.2,lw*2.4]:[]);
    shapes.forEach(s=>{
      if(s.k==='rect'){rr(g,X(s.x1),Y(s.y1),X(s.x2)-X(s.x1),Y(s.y2)-Y(s.y1),s.round?Math.min(lw*9,(X(s.x2)-X(s.x1))/4):0);g.stroke();}
      else if(s.k==='circ'){g.beginPath();g.arc(X(s.x),Y(s.y),R(s.r),0,7);g.stroke();
        if(s.cross){const c=R(s.r)*.45;g.beginPath();g.moveTo(X(s.x)-c,Y(s.y));g.lineTo(X(s.x)+c,Y(s.y));g.moveTo(X(s.x),Y(s.y)-c);g.lineTo(X(s.x),Y(s.y)+c);g.stroke();}}
      else if(s.k==='line'){g.beginPath();g.moveTo(X(s.x1),Y(s.y1));g.lineTo(X(s.x2),Y(s.y2));g.stroke();
        if(s.arrow){g.setLineDash([]);const a=Math.atan2(Y(s.y2)-Y(s.y1),X(s.x2)-X(s.x1)),L=lw*6;
          g.beginPath();g.moveTo(X(s.x2)-L*Math.cos(a-.5),Y(s.y2)-L*Math.sin(a-.5));g.lineTo(X(s.x2),Y(s.y2));g.lineTo(X(s.x2)-L*Math.cos(a+.5),Y(s.y2)-L*Math.sin(a+.5));g.stroke();
          g.setLineDash(pass?[lw*3.2,lw*2.4]:[]);}}

/* ---------- colour engine ----------

   A look = white balance (linear light) → tone curve on lightness → per-hue adjustments, vibrance and
   skin-protected saturation → film-like density (highlights and deep shadows lose colour) → split toning.

   instead of clipping channels (clipping shifts hue and flattens detail).

  if(!lastBlob)return;
  const name='frame-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.jpg';
  const file=new File([lastBlob],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=lastURL;a.download=name;document.body.appendChild(a);a.click();a.remove();
  $('rTip').textContent='已下載。iPhone 在「檔案」App 的下載項目裡，也可以長按照片儲存。';
};

new ResizeObserver(()=>{sizeCanvas();draw();}).observe(vf);
sizeCanvas();buildStrip();pick(0);
})();
</script>
