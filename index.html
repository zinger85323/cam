<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0B10">
<title>照著框拍</title>
<style>
/* Camera UI: one dark look on purpose (a viewfinder). 3:4 viewport with overlay, category tabs, template strip, shutter row */
:root{
  --bg:#0E0B10; --panel:#1B1620; --ink:#F4EEF6; --muted:#A397AC; --accent:#E9C98A; --rec:#FF6688;
  color-scheme:dark;
  --f:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f);overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));font-size:14px}
.top b{font-size:16px;letter-spacing:.06em}
.ibtn{background:var(--panel);color:var(--ink);border:0;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px}
.ibtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vf{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:3/4;max-height:calc(100dvh - 290px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:#000;overflow:hidden;touch-action:none}
@supports not (height:100dvh){.vf{max-height:calc(100vh - 290px)}}
body.cp .vf{max-height:calc(100dvh - 408px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
@supports not (height:100dvh){body.cp .vf{max-height:calc(100vh - 408px)}}
/* landscape (turning the phone sideways): the viewfinder fills the screen like the native camera;
   the shutter column sits at the right edge and the template picker folds into a small button */
body.lscape{overflow:hidden}
body.lscape .hint,body.lscape .banner,body.lscape #refbox{display:none!important}
body.lscape .vf{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;margin:0;z-index:1}
body.lscape .shoot{position:fixed;top:0;right:0;bottom:0;width:112px;margin:0;padding:12px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:4}
body.lscape .shoot .l,body.lscape .shoot .r{justify-self:auto}
/* controls kept on the left, clear of the phone's side safe area: 分頁 at the top, 調色/格線/倒數 and 動作 at the bottom */
/* 選項 folds the whole left column (分頁, 調色, 格線, 倒數, 動作) into one small button at the top left */
body.lscape #lcBtn{display:block;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:6;margin:0}
body:not(.lscape) #lcBtn{display:none!important}
body.lscape:not(.lcol) #tabs,body.lscape:not(.lcol) .top,body.lscape:not(.lcol) #stripBtn,body.lscape:not(.lcol) #strip,body.lscape:not(.lcol) #fbar,body.lscape:not(.lcol) #fixRow,body.lscape:not(.lcol) #matchRow{display:none!important}
body.lscape #tabs{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(108px + env(safe-area-inset-left,0px));z-index:5;margin:0;display:flex!important;gap:6px}
body.lscape #tabs button{padding:6px 10px;font-size:13px}
body.lscape .top{display:flex;position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px;z-index:5;margin:0;padding:0;background:none;border:0}
body.lscape .top>div:first-child{display:none!important}
body.lscape #stripBtn{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:58px;z-index:5;margin:0}
body.lscape #strip{position:fixed;left:0;right:112px;bottom:0;z-index:3;margin:0;padding:10px calc(10px + env(safe-area-inset-left,0px)) 56px;max-height:55%;overflow-y:auto;background:rgba(0,0,0,.72)}
body.lscape.cp #fbar,body.lscape.cp #fixRow,body.lscape.cp #matchRow{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));right:112px;z-index:3;max-height:40%;overflow-y:auto;background:rgba(0,0,0,.72);border-radius:12px;padding:8px}
body.lscape.cp #fbar{top:calc(56px + env(safe-area-inset-top,0px))}
body.lscape.cp #fixRow,body.lscape.cp #matchRow{bottom:104px}
/* 填滿: the viewfinder takes the space the phone leaves; the photo is cropped to that same shape */
body.fill:not(.lscape) .vf{aspect-ratio:auto;flex:1 1 auto;min-height:0;max-height:none}
/* color panel: hidden until 調色 is tapped */
body:not(.cp) #fbar,body:not(.cp) #fixRow,body:not(.cp) #matchRow{display:none!important}
.fbar{display:flex;gap:8px;overflow-x:auto;padding:6px max(14px,env(safe-area-inset-left,0px)) 2px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar button{flex:0 0 auto;position:relative;background:var(--panel);color:var(--ink);border:0;border-radius:99px;padding:7px 13px;font:500 13px var(--f)}
.fbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fbar button.rec::after{content:"推薦";position:absolute;top:-6px;right:-4px;font-size:9px;font-weight:700;background:var(--accent);color:#1a1408;padding:1px 5px;border-radius:99px}
.fbar .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf video.mirror{transform:scaleX(-1)}
.vf canvas{position:absolute;inset:0;width:100%;height:100%}
.banner{position:absolute;left:10px;top:10px;right:10px;display:flex;pointer-events:none}
.banner span{background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;padding:6px 12px;border-radius:99px;max-width:100%}
.lens{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(0,0,0,.35);padding:5px;border-radius:99px}
.lens button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font:600 13px var(--f)}
.lens button[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.lens button.suggest:not([aria-pressed="true"]){box-shadow:inset 0 0 0 1px rgba(233,201,138,.6)}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:800;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5);pointer-events:none}
.focus{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:1.5px solid var(--accent);border-radius:6px;pointer-events:none}
.focus.go{animation:fz .35s ease-out}
@keyframes fz{from{transform:scale(1.5);opacity:.4}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.focus.go{animation:none}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:24px;background:var(--bg);font-size:15px;line-height:1.6}
.msg button{background:var(--accent);color:#1a1408;border:0;border-radius:12px;padding:12px 20px;font:700 16px var(--f)}
.hint{text-align:center;font-size:12px;color:var(--muted);padding:6px 14px 0;min-height:24px}
.tabs{display:flex;justify-content:center;gap:6px;padding:6px 14px 0}
.tabs button{background:none;border:0;color:var(--muted);font:600 14px var(--f);padding:6px 12px;border-radius:99px;letter-spacing:.06em}
.tabs button[aria-pressed="true"]{color:var(--bg);background:var(--accent)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px max(14px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none;min-height:122px}
.strip::-webkit-scrollbar{display:none}
.tpl{flex:0 0 auto;width:66px;border:0;padding:0;background:none;color:var(--ink);font:inherit;font-size:11px;display:flex;flex-direction:column;gap:5px;align-items:center;line-height:1.25;text-align:center}
.tpl canvas{width:66px;height:88px;border-radius:10px;background:#2A2330;display:block}
.tpl[aria-pressed="true"] canvas{outline:2px solid var(--accent);outline-offset:1px}
.refbox{display:flex;flex-direction:column;gap:8px;padding:4px 14px 0;width:100%;max-width:560px;margin:0 auto;font-size:13px}
.refbox .row{display:flex;gap:10px;align-items:center}
.file{position:relative;overflow:hidden;display:inline-block}
.file input{position:absolute;inset:0;opacity:0}
.refbox input[type=range]{flex:1;accent-color:var(--accent)}
.shoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 22px 12px;margin-top:auto}
.shoot .l{justify-self:start}.shoot .r{justify-self:end}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active span{transform:scale(.9)}
.thumb{width:48px;height:48px;border-radius:10px;border:2px solid #fff;object-fit:cover;background:var(--panel)}
#review{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#review img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:12px}
#review .row{display:flex;gap:10px}
#review .row button{flex:1;padding:14px;border-radius:12px;border:0;font:700 16px var(--f);background:var(--panel);color:var(--ink)}
#review .row button.save{background:var(--accent);color:#1a1408}
#review p{margin:0;text-align:center;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;flex-direction:column;line-height:1.2"><b>照著框拍 <span style="font-size:10px;font-weight:400;color:var(--muted)">v2026.11.11-11</span></b><span id="res" style="font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums"></span></div>
  <div style="display:flex;gap:8px">
    <button class="ibtn" id="colorBtn" aria-pressed="false">調色</button>
    <button class="ibtn" id="gridBtn" aria-pressed="true">格線</button>
    <button class="ibtn" id="fillBtn" aria-pressed="true">填滿</button>
    <button class="ibtn" id="timerBtn" aria-pressed="false">倒數 3 秒</button>
  </div>
</div>

<div class="vf" id="vf">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="pc" hidden></canvas>
  <canvas id="ov"></canvas>
  <div class="banner"><span id="banner"></span></div>
  <div class="lens" id="lens"></div>
  <div class="focus" id="focus" hidden></div>
  <div class="count" id="count" hidden></div>
  <div class="count" id="busy" hidden style="font-size:18px;font-weight:600;background:rgba(0,0,0,.35)">處理中…</div>
  <div class="flash" id="flash"></div>
  <div class="msg" id="msg">
    <div>點下面按鈕開啟相機。<br>請允許使用相機。</div>
    <button id="startBtn">開啟相機</button>
  </div>
</div>
<div class="hint" id="hint">拖曳虛線移位置，雙指縮放大小，點一下對焦。</div>
<div class="fbar" id="fbar"></div>
<input id="matchIn" type="file" accept="image/*" hidden>
<div class="refbox" id="matchRow" hidden>
  <div class="row"><span>強度</span><input id="matchK" type="range" min="10" max="100" step="5" value="100"><output id="matchOut" style="color:var(--muted);min-width:3ch;font-variant-numeric:tabular-nums">100</output></div>
</div>

<button class="ibtn" id="lcBtn" aria-expanded="false">選項 ▸</button>
<div class="tabs" id="tabs">
  <button data-c="people" aria-pressed="true">人像</button>
  <button data-c="food" aria-pressed="false">食物</button>
  <button data-c="scene" aria-pressed="false">風景建築</button>
  <button data-c="ref" aria-pressed="false">照片疊圖</button>
</div>
<button class="ibtn" id="stripBtn" aria-expanded="false" hidden></button>
<div class="strip" id="strip" hidden></div>
<div class="refbox" id="refbox" hidden>
  <div class="row">
    <label class="ibtn file">選一張想模仿的照片<input id="refIn" type="file" accept="image/*"></label>
    <span id="refName" style="color:var(--muted)">還沒選</span>
  </div>
  <div class="row"><span>透明度</span><input id="refOp" type="range" min="10" max="80" value="40"></div>
</div>

<div class="refbox" id="fixRow">
  <div class="row"><span style="min-width:4.2em">白平衡</span><input id="awbK" type="range" min="0" max="100" step="5" value="0"><output id="awbOut" style="color:var(--muted);min-width:3ch;font-variant-numeric:tabular-nums">0</output></div>
  <div class="row"><span style="min-width:4.2em">亮暗修復</span><input id="sdK" type="range" min="0" max="100" step="5" value="0"><output id="sdOut" style="color:var(--muted);min-width:3ch;font-variant-numeric:tabular-nums">0</output></div>
</div>
<div class="shoot">
  <img class="thumb l" id="thumb" alt="" hidden>
  <span class="l" id="thumbPh"></span>
  <button class="shutter" id="shutter" aria-label="拍照"><span></span></button>
  <div class="r" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
    <button class="ibtn" id="flipBtn">前／後鏡頭</button>
    <label class="ibtn file" id="hqWrap" hidden>內建相機<input id="hqIn" type="file" accept="image/*" capture="environment"></label>
  </div>
</div>

<div id="review" hidden>
  <img id="rImg" alt="剛拍的照片">
  <p id="rTip">按「存到相簿」後選「儲存影像」。也可以長按照片儲存。</p>
  <div class="row">
    <button id="retake">再拍一張</button>
    <button class="save" id="saveBtn">存到相簿</button>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const v=$('v'),ov=$('ov'),oc=ov.getContext('2d'),vf=$('vf');

/* ---------- templates ----------
   Coordinates: x = fraction of width, y = fraction of height. Circle r = fraction of width.
   s: shapes  rect{x1,y1,x2,y2,round}  circ{x,y,r,cross}  line{x1,y1,x2,y2,arrow}  sil{x,y1,y2,kind}  text{x,y,t} */
const TPL={
 people:[
  {n:'全身置中',lens:'1',say:'站進框裡，腳踩框底',s:[
    {k:'sil',x:.5,y1:.3,y2:.92,kind:'stand'},{k:'rect',x1:.37,y1:.3,x2:.63,y2:.92,round:1},{k:'text',x:.5,y:.955,t:'腳在這'}]},
  {n:'坐著',lens:'2',say:'坐好，整個人放進框',s:[
    {k:'sil',x:.5,y1:.27,y2:.94,kind:'sit'},{k:'rect',x1:.35,y1:.27,x2:.65,y2:.94,round:1}]},
  {n:'半身',lens:'2',say:'頭頂留一點空，胸口以上',s:[
    {k:'sil',x:.5,y1:.2,y2:1.0,kind:'half'},{k:'rect',x1:.24,y1:.18,x2:.76,y2:1.02,round:1}]},
  {n:'臉在三分點',lens:'2',say:'眼睛對準圈圈中間',s:[
    {k:'circ',x:.667,y:.333,r:.09,cross:1},{k:'rect',x1:.52,y1:.24,x2:.82,y2:1.02,round:1}]},
  {n:'看的方向留白',lens:'1',say:'她看向箭頭那邊，前面留空',s:[
    {k:'sil',x:.33,y1:.32,y2:.92,kind:'stand'},{k:'rect',x1:.22,y1:.32,x2:.44,y2:.92,round:1},{k:'line',x1:.5,y1:.5,x2:.85,y2:.5,arrow:1}]},
  {n:'小人遠景',lens:'0.5',say:'地平線放下面三分之一，人小小的',s:[
    {k:'line',x1:0,y1:.667,x2:1,y2:.667},{k:'rect',x1:.635,y1:.55,x2:.70,y2:.8,round:1},{k:'text',x:.667,y:.84,t:'人'}]},
  {n:'消失點',lens:'1',say:'站在路中間，線條往她集中',s:[
    {k:'line',x1:.5,y1:.48,x2:.04,y2:1},{k:'line',x1:.5,y1:.48,x2:.96,y2:1},{k:'rect',x1:.45,y1:.5,x2:.55,y2:.74,round:0}]},
  {n:'托腮',lens:'2',say:'手托下巴，眼睛看向鏡頭斜上方',s:[{k:'pose',name:'chin',x:.5,y1:.27,y2:.94},{k:'rect',x1:.35,y1:.27,x2:.65,y2:.94,round:1}]},
  {n:'雙手插口袋',lens:'1',say:'雙手放口袋，肩膀放鬆，身體微側',s:[{k:'pose',name:'pocket',x:.5,y1:.3,y2:.92},{k:'rect',x1:.36,y1:.3,x2:.64,y2:.92,round:1}]},
  {n:'張開雙臂',lens:'0.5',say:'雙臂打開，從腰部往上拍，會有氣勢',s:[{k:'pose',name:'open',x:.5,y1:.28,y2:.93},{k:'rect',x1:.2,y1:.28,x2:.8,y2:.93,round:1}]},
  {n:'跳躍',lens:'1',say:'膝蓋收起、手往上揮，在最高點按快門',s:[{k:'pose',name:'jump',x:.5,y1:.12,y2:.94},{k:'rect',x1:.3,y1:.12,x2:.7,y2:.94,round:1}]},
  {n:'蹲下抱膝',lens:'2',say:'蹲低，從斜上方往下拍',s:[{k:'pose',name:'crouch',x:.5,y1:.36,y2:.94},{k:'rect',x1:.3,y1:.36,x2:.7,y2:.94,round:1}]},
  {n:'單腳倚靠',lens:'1',say:'一腳屈起、手扶腰，重心放在另一腳',s:[{k:'pose',name:'leg',x:.5,y1:.3,y2:.92},{k:'rect',x1:.34,y1:.3,x2:.66,y2:.92,round:1}]},
  {n:'坐台階',lens:'2',say:'坐在台階上，雙手放膝蓋，人稍微往前',s:[{k:'pose',name:'sitstep',x:.5,y1:.3,y2:.94},{k:'rect',x1:.33,y1:.3,x2:.67,y2:.94,round:1}]},
  {n:'倚坐',lens:'2',say:'身體往後靠，腿伸直，從斜前方拍',s:[{k:'pose',name:'lean',x:.5,y1:.3,y2:.95},{k:'rect',x1:.3,y1:.3,x2:.7,y2:.95,round:1}]},
  {n:'單膝跪地',lens:'1',say:'一膝著地，另一腳踩地，從高一點往下拍',s:[{k:'pose',name:'kneel',x:.5,y1:.3,y2:.95},{k:'rect',x1:.32,y1:.3,x2:.68,y2:.95,round:1}]},
  {n:'側躺',lens:'1',say:'身體側躺在地上，手機放低到與人同高',s:[{k:'pose',name:'lying',x:.5,y1:.55,y2:.93},{k:'rect',x1:.08,y1:.55,x2:.92,y2:.93,round:1}]},
  {n:'回頭走',lens:'1',say:'邊走邊回頭，腳步大一點，會有動感',s:[{k:'pose',name:'lookback',x:.5,y1:.3,y2:.94},{k:'rect',x1:.33,y1:.3,x2:.67,y2:.94,round:1}]},
  {n:'拿咖啡',lens:'2',say:'一手拿杯子靠近胸口，看向旁邊',s:[{k:'pose',name:'coffee',x:.5,y1:.3,y2:.92},{k:'rect',x1:.34,y1:.3,x2:.66,y2:.92,round:1}]},
 ],
 food:[
  {n:'兩點',lens:'1',say:'主角一個圈，配角一個圈',s:[
    {k:'circ',x:.34,y:.36,r:.17},{k:'circ',x:.64,y:.68,r:.23}]},
  {n:'三角',lens:'2',say:'三樣東西排成三角形',s:[
    {k:'circ',x:.5,y:.3,r:.15},{k:'circ',x:.3,y:.66,r:.19},{k:'circ',x:.72,y:.62,r:.16},{k:'tri',pts:[[.5,.3],[.3,.66],[.72,.62]]}]},
  {n:'俯拍三角',lens:'1',say:'手機舉高，垂直往下拍',s:[
    {k:'circ',x:.32,y:.32,r:.15},{k:'circ',x:.7,y:.4,r:.13},{k:'circ',x:.45,y:.7,r:.22},{k:'tri',pts:[[.32,.32],[.7,.4],[.45,.7]]}]},
  {n:'俯拍置中',lens:'1',say:'盤子放正中間，正上方往下拍',s:[
    {k:'circ',x:.5,y:.52,r:.34},{k:'circ',x:.5,y:.52,r:.15},{k:'circ',x:.84,y:.14,r:.08}]},

function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function poseFig(g,cx,top,h,name){

  [['sl','el'],['el','ha'],['sr','er'],['er','hb'],['hl','kl'],['kl','fl'],['hr','kr'],['kr','fr']].forEach(([a,b])=>limb(a,b,lw));
  g.beginPath();g.moveTo(X(P.sl),Y(P.sl));g.lineTo(X(P.sr),Y(P.sr));g.lineTo(X(P.hr),Y(P.hr));g.lineTo(X(P.hl),Y(P.hl));g.closePath();g.fill();

function drawShapes(g,W,H,shapes,T,lw){

  // pass 2: lines with a soft dark halo then white dashes
  for(const pass of [0,1]){

      else if(s.k==='circ'){g.beginPath();g.arc(X(s.x),Y(s.y),R(s.r),0,7);g.stroke();
        if(s.cross){const c=R(s.r)*.45;g.beginPath();g.moveTo(X(s.x)-c,Y(s.y));g.lineTo(X(s.x)+c,Y(s.y));g.moveTo(X(s.x),Y(s.y)-c);g.lineTo(X(s.x),Y(s.y)+c);g.stroke();}}
      else if(s.k==='line'){g.beginPath();g.moveTo(X(s.x1),Y(s.y1));g.lineTo(X(s.x2),Y(s.y2));g.stroke();
        if(s.arrow){g.setLineDash([]);const a=Math.atan2(Y(s.y2)-Y(s.y1),X(s.x2)-X(s.x1)),L=lw*6;

          g.setLineDash(pass?[lw*3.2,lw*2.4]:[]);}}
      else if(s.k==='tri'){g.save();g.globalAlpha=.5;g.lineWidth=g.lineWidth*.7;g.beginPath();s.pts.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.closePath();g.stroke();g.restore();}
      else if(s.k==='text'&&pass){g.setLineDash([]);g.font=`600 ${lw*6}px ${getComputedStyle(document.body).fontFamily}`;g.textAlign='center';g.textBaseline='middle';
        g.lineWidth=3;g.strokeStyle='rgba(0,0,0,.45)';g.strokeText(s.t,X(s.x),Math.min(Y(s.y),H-lw*5));g.fillText(s.t,X(s.x),Math.min(Y(s.y),H-lw*5));g.strokeStyle='#fff';}
    });
  }

}
function gridLines(g,W,H,lw){

async function focusAt(p){

  if(trCap.exposureMode&&trCap.exposureMode.includes('single-shot'))adv.exposureMode='single-shot';

let stream=null,facing='environment',lensMap={},curLens='1',zoomCap=null,suggest='1';
function stop(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null;}
async function open(deviceId){
  stop();

  const vc={width:{ideal:4032},height:{ideal:3024}};
  if(deviceId)vc.deviceId={exact:deviceId};else vc.facingMode=facing;
  stream=await navigator.mediaDevices.getUserMedia({video:vc,audio:false});
  const tr=stream.getVideoTracks()[0];const cap=tr.getCapabilities?tr.getCapabilities():{};zoomCap=cap.zoom||null;

  if(cap.width&&cap.height&&cap.width.max){
    try{await tr.applyConstraints({width:{ideal:cap.width.max},height:{ideal:cap.height.max}});}catch(e){}
  }
  trCap=cap;curZoom=null;
  if(cap.focusMode&&cap.focusMode.includes('continuous')){try{await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}}
  v.srcObject=stream;await v.play().catch(()=>{});
  v.classList.toggle('mirror',facing==='user');
  imgCap=('ImageCapture' in window)?(()=>{try{return new ImageCapture(tr);}catch(e){return null;}})():null;
  setTimeout(showRes,600);

let imgCap=null,trCap={},curZoom=null,photoSet=null;

    if(pc.fillLightMode&&pc.fillLightMode.includes('off'))photoSet={...(photoSet||{}),fillLightMode:'off'};
  }catch(e){}

}
async function mapLenses(){

  const cv=curveTable(pts,1024),sg=Math.max(.6,Math.min(1.6,R.sd/S.sd)),z=[0,0,0],lab=[0,0,0];
  return (Rl,Gl,Bl,o)=>{
    lin2lab(Rl,Gl,Bl,lab);const L=lab[0],a=lab[1],b=lab[2],L2=sample(cv,L);
    zoneW(L,z);const sa=z[0]*S.za[0]+z[1]*S.za[1]+z[2]*S.za[2],sb=z[0]*S.zb[0]+z[1]*S.zb[1]+z[2]*S.zb[2];
    zoneW(L2,z);let oa=z[0]*R.za[0]+z[1]*R.za[1]+z[2]*R.za[2]-sa,ob=z[0]*R.zb[0]+z[1]*R.zb[1]+z[2]*R.zb[2]-sb;
    const om=Math.hypot(oa,ob);if(om>.1){oa*=.1/om;ob*=.1/om;}                 // never push the cast further than this
    const C=Math.hypot(a,b);let h=Math.atan2(b,a)/RAD;if(h<0)h+=360;
    const kc=k*(1-.5*skinW(L,C,h)),a2=sa+oa+(a-sa)*sg,b2=sb+ob+(b-sb)*sg;       // skin moves half as far
    o[0]=L+(L2-L)*k;o[1]=a+(a2-a)*kc;o[2]=b+(b2-b)*kc;
  };
}
/* which look suits this scene */
function recommend(s,cat){
  const p50=s.q[3],range=s.q[5]-s.q[1];
  if(p50<.32)return['night','畫面偏暗'];
  if(cat==='people'&&s.skin>.04)return s.mb>.035?['portra','暖光人像']:['hassel','有膚色，保持自然'];
  if(cat==='food')return s.mc<.03?['milk','食物顏色偏淡']:['tasty','暖一點更可口'];
  if(s.green>.3)return cat==='scene'?['velvia','綠色很多']:['forest','綠色很多'];
  if(s.blue>.3)return cat==='scene'?['slide','藍天很多']:['clear','藍色很多'];
  if(s.mb>.06&&s.ma>0)return['golden','暖色光線，像夕陽'];
  if(s.skin>.08)return['portra','畫面有膚色'];
  if(s.mc<.03)return p50>.7?['milk','畫面很亮、顏色淡']:['film','顏色偏灰'];
  if(range<.35)return['vivid','反差偏低'];
  if(range>.75)return['cchrome','光比大、陰影深'];
  return cat==='scene'?['cchrome','光線正常']:['vivid','光線正常'];
}

/* ---------- apply a LUT to RGBA pixels (a full image or one horizontal strip of it) ---------- */
const LI=new Uint16Array(256),LF=new Float32Array(256);for(let i=0;i<256;i++){const x=i*(N-1)/255;let k=x|0;if(k>N-2)k=N-2;LI[i]=k;LF[i]=x-k;}
function applyLUT(d,w,h,y0,W,H,lut,fx,seed,pre){
  const gr=(fx.grain||0)*255,vig=fx.vig||0,blk=Math.max(1,Math.round(W/900)),dR=N2*3,dG=N*3;
  let VT=null;
  if(vig>0){VT=new Float32Array(258);const a=1/Math.sqrt(Math.pow(1-vig,2.2))-1;for(let i=0;i<258;i++){const q=1+a*i/256;VT[i]=Math.pow(1/(q*q),1/2.2);}}
  const cx=W/2,cy=H/2,rr=256/(cx*cx+cy*cy);let s=seed|0;
  const pr=pre||null,pmap=pr?pr.map:null,mw=pr?pr.mw:0,mh=pr?pr.mh:0,pwg=pr?pr.gr:1,pgg=pr?pr.gg:1,pbg=pr?pr.gb:1,psh=pr?pr.sh:0,phi=pr?pr.hi:0;
  for(let y=0,i=0;y<h;y++){
    const Y=y+y0,dy2=(Y-cy)*(Y-cy),by=(Y/blk)|0,my=pmap?((Y*mh/H)|0)*mw:0;
    for(let x=0;x<w;x++,i+=4){
      let r=d[i],g=d[i+1],b=d[i+2];
      if(pr){
        r*=pwg;g*=pgg;b*=pbg;                                   // grey-world gains
        if(pmap){const M=pmap[my+((x*mw/W)|0)],Lp=(.2126*r+.7152*g+.0722*b)/255,
          k=1+psh*(1-M)*(1-M)*(1-Lp)-phi*M*M*Lp;                // dark pixels in a dark surrounding lift; bright in a bright one settle
          r*=k;g*=k;b*=k;}
        r=r<0?0:r>255?255:(r+.5)|0;g=g<0?0:g>255?255:(g+.5)|0;b=b<0?0:b>255?255:(b+.5)|0;
      }
      const fr=LF[r],fg=LF[g],fb=LF[b],c0=(LI[r]*N2+LI[g]*N+LI[b])*3,c3=c0+dR+dG+3;
      let c1,c2,w0,w1,w2,w3;
      if(fr>fg){if(fg>fb){c1=c0+dR;c2=c1+dG;w0=1-fr;w1=fr-fg;w2=fg-fb;w3=fb;}
        else if(fr>fb){c1=c0+dR;c2=c1+3;w0=1-fr;w1=fr-fb;w2=fb-fg;w3=fg;}
        else{c1=c0+3;c2=c1+dR;w0=1-fb;w1=fb-fr;w2=fr-fg;w3=fg;}}
      else{if(fb>fg){c1=c0+3;c2=c1+dG;w0=1-fb;w1=fb-fg;w2=fg-fr;w3=fr;}
        else if(fb>fr){c1=c0+dG;c2=c1+3;w0=1-fg;w1=fg-fb;w2=fb-fr;w3=fr;}
        else{c1=c0+dG;c2=c1+dR;w0=1-fg;w1=fg-fr;w2=fr-fb;w3=fb;}}
      let R=w0*lut[c0]+w1*lut[c1]+w2*lut[c2]+w3*lut[c3],G=w0*lut[c0+1]+w1*lut[c1+1]+w2*lut[c2+1]+w3*lut[c3+1],B=w0*lut[c0+2]+w1*lut[c1+2]+w2*lut[c2+2]+w3*lut[c3+2];
      if(VT){const k=VT[(((x-cx)*(x-cx)+dy2)*rr)|0];R*=k;G*=k;B*=k;}
      let nz;
      if(gr){let hs=(((x/blk)|0)*73856093)^(by*19349663)^s;hs=Math.imul(hs^(hs>>>15),2246822519);hs^=hs>>>13;
        const l=(.2126*R+.7152*G+.0722*B)/255;nz=(((hs&1023)+((hs>>>10)&1023))/1023-1)*gr*(.35+2.6*l*(1-l));}
      else{s=(Math.imul(s,1664525)+1013904223)|0;nz=((s>>>16)&255)/255-.5;}
      d[i]=R+nz;d[i+1]=G+nz;d[i+2]=B+nz;
    }
  }
}
/* ---------- auto white balance (grey world) + shadow/highlight recovery (local tone) ---------- */
const lmC=document.createElement('canvas');lmC.width=48;lmC.height=64;const lmG=lmC.getContext('2d',{willReadFrequently:true});
/* local average brightness on a 48×64 grid: the "surrounding" each pixel is compared against */
function localMean(src,sw,sh){
  const W=48,H=64;lmG.drawImage(src,0,0,sw,sh,0,0,W,H);
  const d=lmG.getImageData(0,0,W,H).data,a=new Float32Array(W*H),t=new Float32Array(W*H);
  for(let i=0,j=0;i<W*H;i++,j+=4)a[i]=(.2126*d[j]+.7152*d[j+1]+.0722*d[j+2])/255;
  for(let p=0;p<2;p++){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){let q=0;for(let k=-3;k<=3;k++)q+=a[y*W+Math.min(W-1,Math.max(0,x+k))];t[y*W+x]=q/7;}
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){let q=0;for(let k=-3;k<=3;k++)q+=t[Math.min(H-1,Math.max(0,y+k))*W+x];a[y*W+x]=q/7;}
  }
  return a;
}
/* pre-pass settings for one frame. stats: scene statistics (for grey world); src: canvas used for the local map */
function makePre(stats,src,sw,sh){
  const aw=awbK,sd=sdK;if(!aw&&!sd)return null;
  const pre={gr:1,gg:1,gb:1,sh:0,hi:0,map:null,mw:48,mh:64};
  if(aw&&stats){
    const conf=1-ss(.03,.08,stats.mc);                       // grey world only holds when the scene is roughly neutral on average
    const avg=(stats.lr+stats.lg+stats.lb)/3,k=aw*conf/2.2;  // /2.2: gain applied to encoded values
    const g=c=>Math.max(.75,Math.min(1.33,Math.pow(avg/Math.max(c,1e-4),k)));
    pre.gr=g(stats.lr);pre.gg=g(stats.lg);pre.gb=g(stats.lb);
  }
  if(sd&&src){pre.sh=sd*.6;pre.hi=sd*.5;pre.map=localMean(src,sw,sh);}
  return pre;
}

let land=innerWidth>innerHeight;   // sideways phone = landscape layout; otherwise 直拍 fills the space (填滿) or stays 3:4
const RATIOS=[['填滿',0],['1:1',1],['3:4',.75],['4:3',4/3],['16:9',16/9]];   // 比例 button cycles through these (index 0 = fill the space)
let rIdx=0,wantR=3/4;   // wantR = width/height of the frame the viewer sees; crop, preview and photo all use it
document.body.classList.add('fill');
document.body.classList.toggle('lscape',land);
function crop(vw,vh){const want=wantR;let sw=vw,sh=vh;if(vw/vh>want)sw=vh*want;else sh=vw/want;return[(vw-sw)/2,(vh-sh)/2,sw,sh];}

/* ---------- current look ---------- */
let fil='none',autoFil=false,recFil=null,lookK=1,matchK=.8,awbK=0,sdK=0;
let refStats=null,refThumb=null,liveStats=null,matchLUT=null;
const lutCache=new Map();
function lookLUT(key){
  const id=key+'@'+Math.round(lookK*20);let l=lutCache.get(id);
  if(!l){if(lutCache.size>10)lutCache.clear();l=bake(makeLook(FIL[key],Math.round(lookK*20)/20),true);lutCache.set(id,l);}
  return l;
}
function rebuildMatch(){matchLUT=refStats&&liveStats?bake(makeMatch(liveStats,refStats,matchK)):null;}
let idL=null;function idLUT(){return idL||(idL=bake(makeLook({},0),true));}
function currentLUT(){if(fil==='none')return awbK||sdK?idLUT():null;return fil==='match'?matchLUT:lookLUT(fil);}
function currentFX(){const p=fil==='match'||fil==='none'?{}:FIL[fil];return{grain:(p.grain||0)*lookK,vig:(p.vig||0)*lookK};}
const sc=document.createElement('canvas');sc.width=96;sc.height=96;const sg=sc.getContext('2d',{willReadFrequently:true});
function statsOf(src,sx,sy,sw,sh){sg.drawImage(src,sx,sy,sw,sh,0,0,96,96);return labStats(sg.getImageData(0,0,96,96).data);}

/* filter chips */
function buildFbar(){
  const box=$('fbar');box.innerHTML='';
  const a=document.createElement('button');a.textContent='自動';a.setAttribute('aria-pressed',autoFil);
  a.onclick=()=>{autoFil=!autoFil;if(autoFil&&recFil)fil=recFil;buildFbar();};box.appendChild(a);
  // 追色 chip: first tap picks a reference photo, later taps select it; tap again while selected to change photo
  const m=document.createElement('button');m.setAttribute('aria-pressed',fil==='match');
  m.innerHTML=refThumb?`<img src="${refThumb}" alt="" style="width:16px;height:16px;border-radius:4px;object-fit:cover;vertical-align:-3px;margin-right:6px">追色`:'＋ 追色';
  m.onclick=()=>{if(!refStats||fil==='match'){$('matchIn').click();return;}fil='match';autoFil=false;rebuildMatch();buildFbar();};
  box.appendChild(m);
  Object.entries(FIL).forEach(([k,p])=>{
    const b=document.createElement('button');b.innerHTML=`<span class="sw" style="background:${p.sw}"></span>${p.n}`;
    b.setAttribute('aria-pressed',fil===k);if(k===recFil)b.classList.add('rec');
    b.onclick=()=>{fil=k;autoFil=false;buildFbar();};box.appendChild(b);
  });
  $('matchRow').hidden=fil==='none';showRes();
  const kv=Math.round((fil==='match'?matchK:lookK)*100);$('matchK').value=kv;$('matchOut').textContent=kv;
}
let kT=0;
$('matchK').oninput=e=>{
  const k=e.target.value/100;$('matchOut').textContent=e.target.value;
  if(fil==='match'){matchK=k;cancelAnimationFrame(kT);kT=requestAnimationFrame(rebuildMatch);}else lookK=k;
};

$('awbK').oninput=e=>{awbK=e.target.value/100;$('awbOut').textContent=e.target.value;};
$('sdK').oninput=e=>{sdK=e.target.value/100;$('sdOut').textContent=e.target.value;};
/* measure the scene about once a second (in Oklab): feeds the recommendation and 追色 */
function analyse(){
  if(!stream||!v.videoWidth||document.hidden)return;
  const [sx,sy,sw,sh]=crop(v.videoWidth,v.videoHeight),s=statsOf(v,sx,sy,sw,sh);
  liveStats=liveStats?mixStats(liveStats,s,.4):s;              // smoothed so the look doesn't pump while panning
  if(fil==='match')rebuildMatch();
  const [k,why]=recommend(liveStats,cat);
  if(k!==recFil){recFil=k;if(autoFil)fil=k;buildFbar();}
  $('hint').dataset.rec=`${why}，推薦「${FIL[k].n}」`;
  if(!hintT)$('hint').textContent=$('hint').dataset.rec;
}
setInterval(analyse,900);

$('matchIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const bmp=await createImageBitmap(f);
    refStats=statsOf(bmp,0,0,bmp.width,bmp.height);
    const t=document.createElement('canvas');t.width=t.height=48;
    const s=Math.min(bmp.width,bmp.height);t.getContext('2d').drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,48,48);
    refThumb=t.toDataURL('image/jpeg',.7);
    fil='match';autoFil=false;rebuildMatch();buildFbar();hint('已套用參考照片的色調，再點一次「追色」可以換照片。');
  }catch(err){hint('這張照片打不開，換一張試試。');}
};

/* live preview: same LUT as the photo, at a size the phone can keep smooth */
const pc=$('pc'),pg=pc.getContext('2d',{willReadFrequently:true}),PW=[300,360,480];
let pi=1,pms=12,frame=0;
function loop(){
  const lut=stream&&v.videoWidth?currentLUT():null;
  if(pc.hidden!==!lut)pc.hidden=!lut;
  if(lut){
    const [sx,sy,sw,sh]=crop(v.videoWidth,v.videoHeight),W=PW[pi],H=Math.round(W/wantR);
    if(pc.width!==W||pc.height!==H){pc.width=W;pc.height=H;}
    pg.save();if(facing==='user'){pg.translate(W,0);pg.scale(-1,1);}
    pg.drawImage(v,sx,sy,sw,sh,0,0,W,H);pg.restore();
    const pre=makePre(liveStats,pc,W,H);
    const t=performance.now(),img=pg.getImageData(0,0,W,H);
    applyLUT(img.data,W,H,0,W,H,lut,currentFX(),++frame*7919,pre);pg.putImageData(img,0,0);
    pms=pms*.9+(performance.now()-t)*.1;
    if(pms>24&&pi>0){pi--;pms=13;}else if(pms<7&&pi<2){pi++;pms=13;}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
buildFbar();

/* ---------- capture: crops to exactly what the viewfinder shows, guides not included ---------- */
let lastBlob=null,lastURL=null;
const MAXEDGE=4608;   // 16 MP at 4:3, inside every phone's canvas limit
function toCanvas(src,sx,sy,sw,sh,mirror){
  const k=Math.min(1,MAXEDGE/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  const g=c.getContext('2d',{willReadFrequently:true});g.imageSmoothingQuality='high';
  if(mirror){g.translate(c.width,0);g.scale(-1,1);}
  g.drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);g.setTransform(1,0,0,1,0,0);return c;
}
/* apply the current look at full size, in strips so memory stays low and the page stays responsive */
async function develop(c,srcStats){
  let lut=currentLUT();
  if(fil==='match'&&refStats&&srcStats)lut=bake(makeMatch(srcStats,refStats,matchK),true);
  const pre=makePre(awbK?statsOf(c,0,0,c.width,c.height):null,c,c.width,c.height);
  if(!lut&&!pre)return c;
  if(!lut)lut=idLUT();
  const g=c.getContext('2d'),w=c.width,h=c.height,fx=currentFX(),seed=(Math.random()*1e9)|0,rows=Math.max(16,Math.floor(1048576/w));
  $('busy').hidden=false;await new Promise(r=>setTimeout(r,30));
  try{
    for(let y=0,n=0;y<h;y+=rows,n++){
      const hh=Math.min(rows,h-y),img=g.getImageData(0,y,w,hh);applyLUT(img.data,w,hh,y,w,h,lut,fx,seed+y,pre);g.putImageData(img,0,y);
      if(n%4===3)await new Promise(r=>setTimeout(r));
    }
  }finally{$('busy').hidden=true;}
  return c;
}
function grab(){
  const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
  const [sx,sy,sw,sh]=crop(vw,vh);return toCanvas(v,sx,sy,sw,sh,facing==='user');
}
/* Native still photo (Android Chrome etc.): full sensor resolution, cropped to 3:4 */
async function grabPhoto(){
  if(!imgCap)return null;
  try{
    const blob=await imgCap.takePhoto(photoSet||undefined);const bmp=await createImageBitmap(blob);
    if(curZoom&&stream){stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:curZoom}]}).catch(()=>{});}
    const [sx,sy,sw,sh]=crop(bmp.width,bmp.height);return toCanvas(bmp,sx,sy,sw,sh,facing==='user');
  }catch(e){imgCap=null;showRes();return null;}
}
function finish(c){
  c.toBlob(b=>{lastBlob=b;if(lastURL)URL.revokeObjectURL(lastURL);lastURL=URL.createObjectURL(b);
    $('thumb').src=lastURL;$('thumb').hidden=false;$('thumbPh').hidden=true;openReview();},'image/jpeg',.97);
}
let shooting=false;
async function shoot(){
  if(!stream||shooting)return;shooting=true;
  try{
    if(timer){const el=$('count');el.hidden=false;for(let i=3;i>0;i--){el.textContent=i;await new Promise(r=>setTimeout(r,1000));}el.hidden=true;}
    $('flash').style.opacity=.8;setTimeout(()=>$('flash').style.opacity=0,80);
    const c=(await grabPhoto())||grab();if(c)finish(await develop(c));     // the look you saw in the preview is the one applied
  }finally{shooting=false;}
}
/* 內建相機: hand off to the phone's own camera app, then apply the chosen look */
$('hqIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const bmp=await createImageBitmap(f),c=toCanvas(bmp,0,0,bmp.width,bmp.height,false);
    finish(await develop(c,fil==='match'?statsOf(c,0,0,c.width,c.height):null));
  }catch(err){hint('這張照片打不開，請再拍一次。');}
};
function openReview(){$('rImg').src=lastURL;$('review').hidden=false;}
$('shutter').onclick=shoot;$('thumb').onclick=openReview;$('retake').onclick=()=>{$('review').hidden=true;};
$('saveBtn').onclick=async()=>{
  if(!lastBlob)return;
  const name='frame-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.jpg';
  const file=new File([lastBlob],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=lastURL;a.download=name;document.body.appendChild(a);a.click();a.remove();
  $('rTip').textContent='已下載。iPhone 在「檔案」App 的下載項目裡，也可以長按照片儲存。';
};

new ResizeObserver(()=>{sizeCanvas();draw();}).observe(vf);
sizeCanvas();buildStrip();pick(0);
})();
